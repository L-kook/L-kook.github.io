#
# 本站配置 —— L-kook 的个人博客
# 改这里就能改站名 / 作者 / 链接，改完重新 build 即可
#

# ---------- 站点信息 ----------
title:          "L-kook 的博客"
description:    "简约个人博客 · 记录代码与生活"
baseurl:        ""
url:            "https://l-kook.github.io"

# Google Analytics 暂时留空（不启用）
google_analytics:

# ---------- 作者 ----------
author:
  name:         L-kook
  url:          https://github.com/L-kook
  email:

# ---------- 构建设置 ----------
markdown:       kramdown
include:
  - _pages

# ---------- 资源 ----------
sass:
  sass_dir:     _sass
  style:        compressed

# ---------- 插件 ----------
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  # - jemoji   # 需要 emoji 时取消注释

# ---------- 链接格式 & 分页 ----------
permalink:      /:year-:month-:day/:title
paginate:       5

# ---------- 排除文件 ----------
exclude: [ Gemfile, Gemfile.lock, tale.gemspec, README.md ]

# ---------- 评论（Disqus，暂时关闭）----------
disqus: